on:
  push:
    tags:
      - 'v*.*.*'
  # Branch builds (kernel, overlay, installer, disk image) without cutting a
  # release: `gh workflow run build.yaml --ref <branch>`.
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    # Ubicloud managed arm64 runner (RubberBull-ai org); the kernel build is
    # CPU-bound (make -j $(nproc)), so use the largest arm64 size.
    runs-on: ubicloud-standard-60-arm
    steps:
      - uses: actions/checkout@v4
      - uses: imjasonh/setup-crane@v0.4
        with:
          version: v0.20.5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up GitHub Actions bot user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up global environment variables
        run: |
          echo "REGISTRY_USERNAME=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Prepare (checkouts & patches)
        run: make checkouts patches

      # Image tags are derived from the patched checkouts (same patches =>
      # same tag), so an image that already exists in ghcr is not rebuilt.
      - name: Check existing images
        id: images
        run: |
          make -s REGISTRY=ghcr.io REGISTRY_USERNAME=${{ env.REGISTRY_USERNAME }} image-tags | tee images.env
          while IFS='=' read -r key ref; do
            echo "${key}=${ref}" >> "$GITHUB_OUTPUT"
            if crane manifest "${ref}" > /dev/null 2>&1; then exists=true; else exists=false; fi
            echo "${key}_exists=${exists}" >> "$GITHUB_OUTPUT"
            echo "${ref} exists: ${exists}"
          done < images.env

      - name: Kernel
        if: steps.images.outputs.kernel_exists != 'true'
        run: make REGISTRY=ghcr.io REGISTRY_USERNAME=${{ env.REGISTRY_USERNAME }} BUILD_CACHE=1 kernel

      - name: Overlay
        if: steps.images.outputs.overlay_exists != 'true'
        run: make REGISTRY=ghcr.io REGISTRY_USERNAME=${{ env.REGISTRY_USERNAME }} BUILD_CACHE=1 overlay

      - name: Installer images
        if: steps.images.outputs.installer_marker_exists != 'true'
        run: |
          make REGISTRY=ghcr.io REGISTRY_USERNAME=${{ env.REGISTRY_USERNAME }} BUILD_CACHE=1 installer-images
          marker="${{ steps.images.outputs.installer_marker }}"
          crane tag "${{ steps.images.outputs.installer }}" "${marker##*:}"

      - name: Disk image
        run: make REGISTRY=ghcr.io REGISTRY_USERNAME=${{ env.REGISTRY_USERNAME }} disk-image

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: make release

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(cat <<EOF
          > ⚠️ Experimental build, use at your own risk.
          
          This is a patched version of Talos tailored for the Raspberry Pi 5, including NVMe, NIC and USB support.
          
          ### What's available
          
          - 📦 **Raw disk image** (\`metal-arm64.raw.zst\`) for fresh installs
          - ⚙️ **Installer image** (\`ghcr.io/${REGISTRY_USERNAME}/installer:${{ github.ref_name }}\`) for upgrades
          
          ### Install
          
          - **Fresh install**
            - Download the raw disk image from this release
            - Flash with \`dd\` or your favorite tool
          
          - **Upgrade existing node**
            \`\`\`bash
            talosctl upgrade --nodes <NODE_IP> --image ghcr.io/${REGISTRY_USERNAME}/installer:${{ github.ref_name }}
            \`\`\`
          
          EOF
          )
          gh release create \
            ${{ github.ref_name }} \
            ./checkouts/talos/_out/metal-arm64.raw.zst \
            --title "${{ github.ref_name }}" \
            --notes "$NOTES"
